[package]
name = "pana-openmls"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
publish = false
description = "Pana's version-pinned OpenMLS client engine boundary"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "=0.9.2", default-features = false, features = ["js"] }
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tls_codec = { version = "=0.5.0", features = ["derive", "serde", "mls"] }
wasm-bindgen = "=0.2.130"
zeroize = "=1.9.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[patch.crates-io]
openmls_basic_credential = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
openmls_memory_storage = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
