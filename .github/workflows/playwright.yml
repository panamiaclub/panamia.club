name: Playwright Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'

# This is a NEW group with different semantics -- not the old one surviving.
# The repo-wide shared-database group was removed in the same commit as
# DROP SCHEMA public CASCADE, which is the constraint that actually matters.
# That group guarded one shared Supabase project and never queued: GitHub
# holds one running plus one *pending* run, and a third evicts the pending
# one, which then reports `cancelled` with an empty jobs list and publishes no
# check-run at all. Across the 300 most recent runs, 42 were cancelled, 41 of
# those ran zero jobs, and 15 of those were on main -- 13.7% of runs testing
# nothing, and main landing unverified 15 times.
#
# This group does something different: it caps runner consumption per ref.
# Each run now owns a throwaway container that dies with the runner, so there
# is no shared state to corrupt and cancellation is free. That is precisely
# why the old group could never set cancel-in-progress -- killing a run
# mid-DROP SCHEMA or mid-migration left the shared database indeterminate for
# whatever ran next. Removing the shared database is what makes cancelling
# safe, so this only became available once the container landed.
#
# Without it, three pushes to a PR branch mean three concurrent 13-minute runs
# on a repo where runner scarcity is measured and recurring (jobs sit queued
# and are cancelled at exactly 902 seconds having executed nothing). main is
# excluded deliberately: never cancel main, always cancel a superseded
# PR-branch run. That exclusion is the direct lesson of the 15 main runs that
# tested nothing.
#
# Self-cancellation stays distinguishable from the eviction this replaced. A
# superseded run *has jobs* and a newer commit on the same ref; an evicted run
# has *zero jobs*. The diagnostic signature the team relies on survives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # Throwaway database, one per run. Pinned to 17 because that is the version
    # measured on the shared Supabase project this replaced (17.6), not a guess
    # -- and the same probe confirmed Supabase resolves both pg_trgm and
    # unaccent to `public`, exactly as stock postgres:17 does, so the schema
    # placement assertions in migrations 0041 and 0045 take the same branch here
    # as they did there. The replay was also verified green on 15 and 16.
    #
    # Pulled from AWS's public mirror rather than `postgres:17` on Docker Hub.
    # Same Docker Official Image, so everything above still holds -- the only
    # thing that changes is who serves it. Docker Hub meters anonymous pulls per
    # source IP, and Actions runners share those IPs with every other anonymous
    # puller on the hosted fleet, so the quota is not ours to stay inside: on
    # 2026-10-09 every run in this repo failed `Initialize containers` with
    # `toomanyrequests` for about an hour, across fresh runners, with no Docker
    # Hub credentials in the repo to authenticate our way out. public.ecr.aws
    # does not meter anonymous pulls, which removes the shared failure mode
    # rather than waiting it out.
    #
    # If this ever needs to go back to Docker Hub, add DOCKERHUB_USERNAME and
    # DOCKERHUB_TOKEN as secrets and log in first -- authenticated pulls are
    # metered per account, so they do not inherit the fleet's exhausted budget.
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Set once at job level so no step can quietly diverge onto a different
    # database. Plain TCP to the runner's loopback with no pooler in front of
    # it, so none of the IPv4/IPv6 routing and 15-connection constraints that
    # used to shape this file apply, and postgres.js defaults (ssl: false)
    # connect to it as-is. 127.0.0.1 rather than localhost on purpose: the
    # service container publishes on the host's IPv4 loopback, and naming it
    # explicitly removes any IPv6-first resolution.
    env:
      POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v7

      # Runs before anything expensive: this is cheap, needs no node_modules,
      # and catches the class of migration defect that CI otherwise cannot see.
      # It checks file naming, the required Purpose/Ticket/Reversible headers,
      # strictly increasing _journal.json timestamps, and -- the one that
      # matters most -- journal completeness: every drizzle/NNNN_*.sql file
      # must have a journal entry. drizzle-kit migrate, which is what prod
      # runs, silently skips any file the journal does not list. That is how
      # 0048_recommendation_lists merged clean and shipped to production with
      # its tables never created.
      #
      # The replay below is journal-driven as well, so an unjournaled migration
      # is never applied here either and dependent tests fail loudly rather
      # than passing against a schema prod lacks. That leaves this step as the
      # only thing that names the actual defect, which is why --strict is set:
      # it turns a missing Python interpreter into an error instead of a
      # skipped check, so the guard cannot quietly become a no-op.
      - name: Validate migrations
        run: bash scripts/validate-migrations.sh --strict

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The container starts empty, so there is nothing to reset -- it is
      # created with the runner and destroyed with it. What it does need is two
      # things stock Postgres has no reason to provide.
      - name: Bootstrap database
        run: |
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Migration 0014 revokes privileges from `anon` and `authenticated`.
          -- Those are Supabase's PostgREST roles; stock Postgres has neither, and
          -- REVOKE against a role that does not exist is an error, not a no-op,
          -- so without these two the replay dies on 0014 with
          -- `role "anon" does not exist`. NOLOGIN because nothing ever connects
          -- as them -- they exist purely to be revoked from, which is the only
          -- thing 0014 asks of them.
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;

          -- Migration 0015 enables RLS on drizzle.__drizzle_migrations, so the
          -- table must exist for it to have a target. Production gets this table
          -- from drizzle-kit migrate; a raw psql replay has to create it itself.
          CREATE SCHEMA drizzle;
          CREATE TABLE drizzle.__drizzle_migrations (
            id SERIAL PRIMARY KEY,
            hash TEXT NOT NULL,
            created_at BIGINT
          );
          SQL

      # Apply hand-written migrations in order via psql rather than drizzle-kit
      # migrate. Prod still uses drizzle-kit migrate (which tracks applied
      # migrations in drizzle.__drizzle_migrations); CI gets a fresh container
      # every run, so tracking is unnecessary.
      #
      # Order comes from _journal.json, not a filesystem glob, so CI applies
      # migrations in exactly the order drizzle-kit migrate uses in prod.
      # A glob diverges whenever two migrations share a numeric prefix
      # (0035_profile_owners vs 0035_social_statuses_recipients_gin already
      # do, from position 36 on), and it applies files with no journal entry
      # -- which prod silently skips. That gap shipped 0048 to production
      # with its tables never created. Reading the journal also means an
      # unjournaled migration is never applied here, so tests that depend
      # on it fail loudly instead of passing against a schema prod lacks.
      - name: Apply migrations
        run: |
          set -e
          python3 -c "import json; print('\n'.join(e['tag'] for e in sorted(json.load(open('drizzle/meta/_journal.json'))['entries'], key=lambda e: e['idx'])))" > /tmp/migration-order.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            f="drizzle/$tag.sql"
            if [ ! -f "$f" ]; then
              echo "ERROR: journal lists '$tag' but $f does not exist"
              exit 1
            fi
            echo "=== $f ==="
            psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f "$f"
          done < /tmp/migration-order.txt

      # Unit tests (tests-unit/) need no database, no browser and no server --
      # they are pure functions over env vars and literals. Nothing ran them in
      # CI until now, which meant every assertion in that directory was
      # advisory: it could rot for months and only a developer running
      # `yarn test:unit` by hand would notice. They cost about two seconds, so
      # the only reason not to run them was that nobody had.
      #
      # Placed ahead of the database tests so a pure-logic failure reports
      # immediately rather than after a full migration run.
      - name: Run unit tests
        run: yarn test:unit

      # Data-layer tests (tests-db/) run here rather than in their own job so
      # they reuse the database the step above just migrated. They are fast,
      # need no browser, and failing now skips a Playwright install that was
      # going to fail anyway.
      #
      # test:db passes --test-concurrency=1. node --test runs one process per
      # file and each process opens its own postgres.js pool, so connection
      # count scales with the number of test files. That used to collide with a
      # hard ceiling -- the shared Supabase session pooler capped us at 15, and
      # simply adding a tenth file crossed it, failing every test in that file
      # with EMAXCONNSESSION. The container has no such ceiling
      # (max_connections 100 against a measured peak of 10), so the flag is kept
      # for its other effect: it removes cross-file interference between
      # fixtures that share one database. Relaxing it is now possible, but it is
      # a separate change with its own thing to verify.
      - name: Run database tests
        run: yarn test:db

      - name: Validate environment variables
        run: npm run env:check
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          NEXT_PUBLIC_HOST_URL: ${{ vars.NEXT_PUBLIC_HOST_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # wrangler dev reads .dev.vars and injects ALL entries as env bindings (env.KEY)
      # into the Worker. This is how POSTGRES_URL and auth secrets reach the workerd runtime.
      #
      # POSTGRES_URL comes from the job-level env (the service container) rather
      # than a secret, so the Worker and the data-layer tests above address the
      # same database. lib/db.ts prefers env.POSTGRES_URL over the HYPERDRIVE
      # binding, and wrangler.jsonc's localConnectionString is a placeholder, so
      # this file is genuinely the path the Worker takes in CI.
      - name: Create .dev.vars for wrangler dev
        run: |
          echo "POSTGRES_URL=$POSTGRES_URL" >> .dev.vars
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> .dev.vars
          echo "BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL }}" >> .dev.vars
          echo "ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}" >> .dev.vars
          echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> .dev.vars
          echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> .dev.vars
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> .dev.vars
          echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> .dev.vars
          echo "R2_BUCKET_NAME=${{ vars.R2_BUCKET_NAME }}" >> .dev.vars
          echo "R2_PUBLIC_URL=${{ vars.R2_PUBLIC_URL }}" >> .dev.vars
          # Empty on purpose: wrangler.jsonc sets this to ".panamia.club" for
          # production, which browsers reject on the localhost host the test
          # server runs on. Empty restores host-only cookies so any future
          # session-dependent spec can actually hold a session.
          echo "PANAVERSE_COOKIE_DOMAIN=" >> .dev.vars

      # `yarn build` is now just `vinext build` (no migrate prefix), so this
      # is equivalent — kept explicit for clarity that CI does not migrate
      # during build (migrations were applied in the "Apply migrations" step).
      # POSTGRES_DIRECT_URL is deliberately absent: its only reader is
      # drizzle.config.ts, and drizzle-kit is never invoked here.
      - name: Build app
        run: yarn build
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          NEXT_PUBLIC_HOST_URL: ${{ vars.NEXT_PUBLIC_HOST_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_ENABLED: ${{ vars.NEXT_PUBLIC_GOOGLE_ENABLED }}
          NEXT_PUBLIC_APPLE_ENABLED: ${{ vars.NEXT_PUBLIC_APPLE_ENABLED }}
          NEXT_PUBLIC_MASTODON_ENABLED: ${{ vars.NEXT_PUBLIC_MASTODON_ENABLED }}
          NEXT_PUBLIC_WIKIMEDIA_ENABLED: ${{ vars.NEXT_PUBLIC_WIKIMEDIA_ENABLED }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}

      - name: Run Playwright tests
        run: yarn test
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          NEXT_PUBLIC_HOST_URL: ${{ vars.NEXT_PUBLIC_HOST_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_ENABLED: ${{ vars.NEXT_PUBLIC_GOOGLE_ENABLED }}
          NEXT_PUBLIC_APPLE_ENABLED: ${{ vars.NEXT_PUBLIC_APPLE_ENABLED }}
          NEXT_PUBLIC_MASTODON_ENABLED: ${{ vars.NEXT_PUBLIC_MASTODON_ENABLED }}
          NEXT_PUBLIC_WIKIMEDIA_ENABLED: ${{ vars.NEXT_PUBLIC_WIKIMEDIA_ENABLED }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
