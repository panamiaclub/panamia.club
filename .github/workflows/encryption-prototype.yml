name: Encryption prototype

on:
  pull_request:
    paths:
      - 'lib/e2ee/**'
      - 'crypto/openmls/**'
      - 'scripts/openmls.ts'
      - 'tests-openmls/**'
      - 'prototypes/e2ee/**'
      - 'tests-e2ee/**'
      - 'tests-unit/e2ee-*.test.ts'
      - 'vite.e2ee.config.ts'
      - 'playwright.e2ee.config.ts'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/encryption-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'lib/e2ee/**'
      - 'crypto/openmls/**'
      - 'scripts/openmls.ts'
      - 'tests-openmls/**'
      - 'prototypes/e2ee/**'
      - 'tests-e2ee/**'
      - 'tests-unit/e2ee-*.test.ts'
      - 'vite.e2ee.config.ts'
      - 'playwright.e2ee.config.ts'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/encryption-prototype.yml'

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
      - run: yarn install --immutable
      - name: Install pinned Rust toolchain and binding generator
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          cargo +1.99.1 install wasm-bindgen-cli --version 0.2.130 --locked
          cargo +1.99.1 install cargo-audit --version 0.23.0 --locked
          cargo +1.99.1 install cargo-deny --version 0.20.2 --locked
      - run: yarn openmls:check
      - run: yarn openmls:audit
      - run: yarn openmls:build
      - run: git diff --exit-code -- crypto/openmls/pkg/pana_openmls.d.ts
      - run: yarn test:openmls:rust
      - run: yarn test:openmls
      - run: yarn test:e2ee
      - run: yarn playwright install --with-deps chromium webkit
      - run: yarn test:e2ee:browser
